<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EAB02B"/>
      <stop offset="100%" style="stop-color:#C78405"/>
    </linearGradient>
    <clipPath id="roadClip">
      <path d="M0,42 Q50,32 100,42 T200,42 L200,48 Q150,38 100,48 T0,48 Z"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="#FFFFFF"/>
  
  <!-- Letter A - Angular/Geometric -->
  <g transform="translate(25, 10)">
    <!-- A shape - Angular geometric -->
    <path d="M0,60 L18,0 L24,0 L42,60 L35,60 L30,42 L12,42 L7,60 Z M15,36 L27,36 L21,12 Z" 
          fill="#082B5C"/>
  </g>
  
  <!-- Letter R - Curved/Modern with gradient -->
  <g transform="translate(55, 10)">
    <!-- R shape - Modern with curves -->
    <path d="M0,0 L18,0 C28,0 34,6 34,15 C34,22 30,26 24,28 L36,60 L28,60 L17,32 L12,32 L12,60 L5,60 L5,0 Z M12,8 L12,26 L18,26 C23,26 27,23 27,17 C27,11 23,8 18,8 Z" 
          fill="url(#goldGradient)"/>
  </g>
  
  <!-- White curved road stripe crossing the center -->
  <path d="M10,40 Q60,32 100,40 Q140,48 190,40" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Subtle road shadow effect -->
  <path d="M10,41 Q60,33 100,41 Q140,49 190,41" 
        stroke="#082B5C" 
        stroke-width="1" 
        fill="none" 
        opacity="0.1"
        stroke-linecap="round"/>
</svg>
